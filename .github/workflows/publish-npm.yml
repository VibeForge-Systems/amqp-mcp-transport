name: Publish to npm

# Manual only. Run it from the Actions tab against a release tag. It publishes
# @vibeforge-systems/amqp-mcp-transport; package.json's publishConfig makes the scoped package public.
# Requires the NPM_TOKEN repository secret, from an npm account that can publish to the
# @vibeforge-systems scope. Tagging never publishes to npm; see release.yml.

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # id-token: write lets npm sign a provenance statement tying the package to this run.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Must run against a version tag
        run: |
          case "${GITHUB_REF}" in
            refs/tags/v*) ;;
            *) echo "::error::run this workflow against a vX.Y.Z tag, not ${GITHUB_REF}"; exit 1 ;;
          esac

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          # No `cache:` on the publish path: a poisoned dependency cache would ship to npm.
          registry-url: "https://registry.npmjs.org"

      - name: Tag must match package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
