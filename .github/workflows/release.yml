name: Release

# A version tag (vX.Y.Z) builds, tests and packs the package, then publishes a GitHub Release
# with the packed tarball attached. It does NOT publish to npm: that is a separate, deliberate
# step (publish-npm.yml), because an npm release cannot be taken back.
#
# The attached tarball is what consumers can pin instead of a registry or git dependency, e.g.
#   "@vibeforge-systems/amqp-mcp-transport": "https://github.com/VibeForge-Systems/amqp-mcp-transport/releases/download/vX.Y.Z/vibeforge-systems-amqp-mcp-transport-X.Y.Z.tgz"
# which npm installs without running a build and records with an integrity hash it checks.
# Releases up to v1.2.0 were published unscoped, as amqp-mcp-transport-<version>.tgz.

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    # Creating the GitHub Release is the only write; nothing else gets a write token.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          # No `cache:` on the release path: a poisoned dependency cache would ship in the tarball.

      - name: Tag must match package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          # npm pack names a scoped package's tarball <scope>-<name>-<version>.tgz.
          echo "TARBALL=vibeforge-systems-amqp-mcp-transport-${version}.tgz" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Pack
        run: |
          npm pack
          test -f "${TARBALL}"
          sha256sum "${TARBALL}" > "${TARBALL}.sha256"
          cat "${TARBALL}.sha256"

      - name: Release notes from CHANGELOG
        run: |
          awk -v v="${VERSION}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
