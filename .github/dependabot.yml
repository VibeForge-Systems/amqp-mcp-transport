version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
          - "typescript-eslint"
      mcp-sdk-zod:
        patterns:
          - "@modelcontextprotocol/sdk"
          - "zod"
    ignore:
      # engines.node is >=22, so the Node type definitions stay on the 22 line.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Every TypeScript major (6 and 7 today) waits until ts-jest and typescript-eslint support it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
